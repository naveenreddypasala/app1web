Here’s a much shorter version with products, cart, search, and checkout:

```
<!DOCTYPE html>
<html>
<head>
<title>MiniShop</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:white;padding:15px;display:flex;justify-content:space-between}
input{padding:8px;border-radius:5px;border:0}
main{padding:20px}.products{display:flex;flex-wrap:wrap;gap:15px}
.card{background:white;padding:15px;width:200px;border-radius:10px;box-shadow:0 2px 8px #ccc}
.card img{width:100%;height:150px;object-fit:cover}
button{background:#2563eb;color:white;border:0;padding:9px;border-radius:5px;cursor:pointer}
#cart{position:fixed;right:10px;top:70px;background:white;padding:20px;
box-shadow:0 2px 10px #999;width:250px}
</style>
</head>

<body>

<header>
  <b>🛍️ MiniShop</b>
  <input id="search" placeholder="Search..." oninput="show()">
  <button onclick="cart()">🛒 Cart <span id="count">0</span></button>
</header>

<main>
<h2>Products</h2>
<div class="products" id="products"></div>
</main>

<div id="cart" style="display:none">
<h2>Cart</h2>
<div id="items"></div>
<hr>
<b>Total: ₹<span id="total">0</span></b>
<br><br>
<button onclick="checkout()">Checkout</button>
</div>

<script>
let products=[
 {n:"Headphones",p:1999,i:"https://picsum.photos/300?1"},
 {n:"Smart Watch",p:2999,i:"https://picsum.photos/300?2"},
 {n:"T-Shirt",p:799,i:"https://picsum.photos/300?3"},
 {n:"Shoes",p:2499,i:"https://picsum.photos/300?4"}
],cartData=[];

function show(){
 let q=search.value.toLowerCase();
 productsDiv.innerHTML=products.filter(x=>x.n.toLowerCase().includes(q))
 .map((x,i)=>`<div class="card">
 <img src="${x.i}"><h3>${x.n}</h3><b>₹${x.p}</b><br><br>
 <button onclick="add(${i})">Add to Cart</button></div>`).join("");
}
let productsDiv=document.getElementById("products");

function add(i){cartData.push(products[i]);update()}
function update(){
 count.innerText=cartData.length;
 items.innerHTML=cartData.map(x=>`<p>${x.n} - ₹${x.p}</p>`).join("");
 total.innerText=cartData.reduce((s,x)=>s+x.p,0);
}
function cart(){document.getElementById("cart").style.display="block";update()}
function checkout(){
 if(!cartData.length)return alert("Cart is empty!");
 alert("Order placed successfully! 🎉");
 cartData=[];update();
}
show();
</script>

</body>
</html>
```

Save it as **`index.html`** and open it in your browser.
